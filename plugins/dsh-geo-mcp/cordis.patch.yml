# Unified GEO bundle. Both clients use the same public MCP base URL and key.
- insert:
    - id: mcp-geo-geoflow
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: streamable-http
        serverName: geoflow
        url: !!js ((process.env.MCP_BASE_URL || 'https://ixicai.cn/mcp') + '/geoflow')
        headers:
          Authorization: !!js ('Bearer ' + (process.env.MODELS_API_KEY || ''))
        toolCallTimeoutMs: 60000
        failOnStartupError: false
        reconnect:
          enabled: true
    - id: mcp-geo-georank
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: streamable-http
        serverName: georank
        url: !!js ((process.env.MCP_BASE_URL || 'https://ixicai.cn/mcp') + '/georank')
        headers:
          Authorization: !!js ('Bearer ' + (process.env.MODELS_API_KEY || ''))
        toolCallTimeoutMs: 120000
        failOnStartupError: false
        reconnect:
          enabled: true
    - id: geo-mcp-guidance
      name: '@dofe/dsh-geo-mcp'
