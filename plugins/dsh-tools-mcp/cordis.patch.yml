    - id: mcp-tools-custom-car-monitoring
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: streamable-http
        serverName: tools-custom-car-monitoring
        url: !!js ((process.env.TOOLS_MCP_BASE_URL || 'http://127.0.0.1:13103') + '/mcp/custom-car-monitoring')
        toolCallTimeoutMs: 60000
        failOnStartupError: false
        reconnect:
          enabled: true

    - id: mcp-tools-viral-video
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: streamable-http
        serverName: tools-viral-video
        url: !!js ((process.env.TOOLS_MCP_BASE_URL || 'http://127.0.0.1:13103') + '/mcp/viral-video')
        toolCallTimeoutMs: 60000
        failOnStartupError: false
        reconnect:
          enabled: true

    - id: mcp-tools-browser-intelligence
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: streamable-http
        serverName: tools-browser-intelligence
        url: !!js ((process.env.TOOLS_MCP_BASE_URL || 'http://127.0.0.1:13103') + '/mcp/browser-intelligence')
        toolCallTimeoutMs: 60000
        failOnStartupError: false
