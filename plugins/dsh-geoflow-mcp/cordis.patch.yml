# dsh-geoflow-mcp bundle patch.
# Registers geoflow (geo.dofe.ai, Laravel) as a single Streamable HTTP MCP client so
# its tools surface to the model under the mcp__geoflow__<tool> namespace
# (e.g. mcp__geoflow__<tool>).
#
# geoflow serves a stateless JSON-RPC /mcp endpoint (POST only) gated by the
# mcp.auth middleware, which requires Authorization: Bearer <token>. The web
# (nginx) container publishes the host loopback port WEB_PORT (default 13104 on
# the CI deployment), so the harness (host networking) reaches it via the
# extra_hosts mapping geo.test.dofe.ai -> 127.0.0.1 below.
#
# Trusted-host note: geoflow's EnsureTrustedForwardedHost middleware aborts the
# request unless the presented Host is config('app.url')'s host or is listed in
# GEOFLOW_ADDITIONAL_TRUSTED_HOSTS. So GEOFLOW_MCP_URL's host MUST be a host that
# geoflow trusts (its APP_URL host by default, here geo.test.dofe.ai) — keep it
# aligned with the domain mapped in the deployment's extra_hosts. If you switch
# the URL to a custom service alias (e.g. geoflow-web-prod), add that alias to
# GEOFLOW_ADDITIONAL_TRUSTED_HOSTS on the geoflow side.
#
# failOnStartupError stays false: if geoflow is briefly down the web profile
# still boots and the reconnect supervisor registers the tools once it returns.

- insert:
    - id: mcp-geoflow
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        transport: streamable-http
        serverName: geoflow
        url: !!js ((process.env.MCP_BASE_URL || 'https://ixicai.cn/mcp') + '/geoflow')
        headers:
          Authorization: !!js ('Bearer ' + (process.env.MODELS_API_KEY || ''))
        toolCallTimeoutMs: 60000
        failOnStartupError: false
        reconnect:
          enabled: true

    # Registers a system-prompt section telling the model when to reach for the
    # mcp__geoflow__* tools. The module lives in this bundle's index.js.
    - id: geoflow-guidance
      name: '@dofe/dsh-geoflow-mcp'
